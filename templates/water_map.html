<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>แผนที่ระดับน้ำและสถานการณ์น้ำ — FLOODCARE AI</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Noto+Sans+Thai:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css"/>
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script src="https://unpkg.com/@phosphor-icons/web"></script>
<style>
  :root {
    --ink: #0F172A;
    --muted: #64748B;
    --faint: #94A3B8;
    --surface: #FFFFFF;
    --surface-glass: rgba(255, 255, 255, 0.94);
    --bg: #F8FAFC;
    --border: rgba(15, 23, 42, 0.08);
    --line: #E2E8F0;
    --accent: #F97316;
    --accent-dark: #EA580C;
    --accent-light: #FFF7ED;
    --accent-glow: rgba(249, 115, 22, 0.25);
    --s-crit: #EF4444;
    --s-crit-bg: #FEF2F2;
    --s-over: #DC2626;
    --s-over-bg: #FEE2E2;
    --s-high: #F59E0B;
    --s-high-bg: #FFFBEB;
    --s-watch: #EAB308;
    --s-watch-bg: #FEFCE8;
    --s-normal: #10B981;
    --s-normal-bg: #ECFDF5;
    --s-low: #3B82F6;
    --s-low-bg: #EFF6FF;
    --radius-lg: 18px;
    --radius-md: 12px;
    --radius-sm: 8px;
    --shadow-sm: 0 1px 3px rgba(15, 23, 42, 0.06), 0 1px 2px rgba(15, 23, 42, 0.04);
    --shadow-md: 0 4px 16px -2px rgba(15, 23, 42, 0.08), 0 2px 6px -1px rgba(15, 23, 42, 0.04);
    --shadow-lg: 0 20px 25px -5px rgba(15, 23, 42, 0.12), 0 8px 10px -6px rgba(15, 23, 42, 0.05);
  }

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  
  html, body {
    height: 100%;
    width: 100%;
    overflow: hidden;
    background: var(--bg);
    color: var(--ink);
    font-family: 'Noto Sans Thai', 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
    -webkit-font-smoothing: antialiased;
  }

  /* App Shell Flex Layout */
  .app-layout {
    display: flex;
    flex-direction: column;
    height: 100vh;
    height: 100dvh;
    width: 100vw;
    overflow: hidden;
    position: relative;
  }

  /* 1. Header (Page Header) */
  .page-header {
    height: 60px;
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 20px;
    z-index: 1000;
    flex-shrink: 0;
    gap: 12px;
  }
  .brand-group {
    display: flex;
    align-items: center;
    gap: 10px;
    text-decoration: none;
    color: inherit;
    flex-shrink: 0;
  }
  .brand-logo {
    width: 36px;
    height: 36px;
    border-radius: 10px;
    background: var(--accent);
    color: #fff;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 20px;
    box-shadow: 0 4px 10px var(--accent-glow);
  }
  .brand-text h1 {
    font-size: 15px;
    font-weight: 800;
    letter-spacing: -0.01em;
    line-height: 1.15;
    color: var(--ink);
  }
  .brand-text .sub {
    font-size: 11px;
    color: var(--muted);
    font-weight: 500;
  }
  .header-actions {
    display: flex;
    align-items: center;
    gap: 10px;
  }
  .status-pill {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    background: #F1F5F9;
    border: 1px solid var(--line);
    padding: 5px 12px;
    border-radius: 99px;
    font-size: 11.5px;
    font-weight: 700;
    color: var(--muted);
    white-space: nowrap;
  }
  .status-pill .pulse-dot {
    width: 7px;
    height: 7px;
    border-radius: 50%;
    background: var(--s-normal);
    box-shadow: 0 0 0 0 rgba(16, 185, 129, 0.6);
    animation: pulse 2s infinite;
  }
  @keyframes pulse {
    0% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(16, 185, 129, 0.7); }
    70% { transform: scale(1); box-shadow: 0 0 0 6px rgba(16, 185, 129, 0); }
    100% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(16, 185, 129, 0); }
  }
  .btn-nav-dash {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    background: var(--ink);
    color: #fff;
    padding: 7px 14px;
    border-radius: 10px;
    font-size: 12px;
    font-weight: 700;
    text-decoration: none;
    transition: all 0.15s ease;
    white-space: nowrap;
  }
  .btn-nav-dash:hover {
    background: #1E293B;
    transform: translateY(-1px);
  }
  .btn-refresh {
    width: 34px;
    height: 34px;
    border-radius: 8px;
    background: #F1F5F9;
    border: 1px solid var(--line);
    color: var(--muted);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 16px;
    cursor: pointer;
    transition: all 0.15s;
  }
  .btn-refresh:hover {
    color: var(--ink);
    background: var(--line);
  }
  .btn-refresh.loading i {
    animation: spin 0.8s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* 2. Control Bar (Search / Filter / Controls) */
  .control-bar {
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    padding: 8px 20px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    z-index: 900;
    flex-shrink: 0;
    overflow-x: auto;
  }
  .control-bar::-webkit-scrollbar { display: none; }
  
  .search-container {
    position: relative;
    width: 320px;
    flex-shrink: 0;
  }
  .search-box {
    display: flex;
    align-items: center;
    gap: 8px;
    background: #F8FAFC;
    border: 1px solid var(--line);
    border-radius: 10px;
    padding: 7px 12px;
    transition: all 0.15s;
  }
  .search-box:focus-within {
    background: #fff;
    border-color: var(--accent);
    box-shadow: 0 0 0 3px var(--accent-glow);
  }
  .search-box input {
    border: none;
    outline: none;
    background: transparent;
    font-family: inherit;
    font-size: 12.5px;
    color: var(--ink);
    width: 100%;
  }
  .search-box i {
    color: var(--muted);
    font-size: 15px;
  }
  .search-dropdown {
    position: absolute;
    top: calc(100% + 6px);
    left: 0;
    right: 0;
    background: var(--surface);
    border-radius: 12px;
    border: 1px solid var(--border);
    box-shadow: var(--shadow-lg);
    max-height: 300px;
    overflow-y: auto;
    z-index: 1100;
    display: none;
  }
  .search-dropdown.show { display: block; }
  .search-item {
    padding: 10px 14px;
    border-bottom: 1px solid var(--line);
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
    cursor: pointer;
    transition: background 0.1s;
  }
  .search-item:last-child { border-bottom: none; }
  .search-item:hover { background: var(--accent-light); }
  .search-item-info .title { font-size: 12.5px; font-weight: 700; color: var(--ink); }
  .search-item-info .desc { font-size: 11px; color: var(--muted); margin-top: 1px; }

  /* Filters */
  .filter-chips {
    display: flex;
    align-items: center;
    gap: 6px;
    overflow-x: auto;
    white-space: nowrap;
    padding: 2px 0;
  }
  .filter-chips::-webkit-scrollbar { display: none; }
  .chip {
    padding: 5px 12px;
    border-radius: 99px;
    font-size: 11.5px;
    font-weight: 700;
    background: #F1F5F9;
    color: var(--muted);
    border: 1px solid transparent;
    cursor: pointer;
    display: inline-flex;
    align-items: center;
    gap: 5px;
    transition: all 0.15s;
    user-select: none;
  }
  .chip:hover {
    background: var(--line);
    color: var(--ink);
  }
  .chip.active {
    background: var(--ink);
    color: #fff;
  }
  .chip .dot-indicator {
    width: 7px;
    height: 7px;
    border-radius: 50%;
  }

  .quick-controls {
    display: flex;
    align-items: center;
    gap: 6px;
    flex-shrink: 0;
  }
  .btn-quick {
    padding: 6px 12px;
    border-radius: 8px;
    background: #F8FAFC;
    border: 1px solid var(--line);
    color: var(--ink);
    font-size: 11.5px;
    font-weight: 700;
    display: inline-flex;
    align-items: center;
    gap: 6px;
    cursor: pointer;
    transition: all 0.15s;
  }
  .btn-quick:hover {
    background: var(--line);
  }
  .btn-quick.primary {
    background: var(--accent);
    color: #fff;
    border-color: var(--accent);
  }
  .btn-quick.primary:hover {
    background: var(--accent-dark);
  }

  /* 3. Main Workspace (Map + Side Panel) */
  .main-workspace {
    flex: 1;
    position: relative;
    display: flex;
    overflow: hidden;
    width: 100%;
    height: 100%;
  }

  /* Map Container */
  #map {
    flex: 1;
    width: 100%;
    height: 100%;
    background: #E2E8F0;
    z-index: 1;
  }

  /* Map Floating Legend */
  .map-legend {
    position: absolute;
    bottom: 24px;
    left: 20px;
    z-index: 500;
    background: var(--surface-glass);
    backdrop-filter: blur(8px);
    border: 1px solid var(--border);
    border-radius: var(--radius-md);
    padding: 10px 14px;
    box-shadow: var(--shadow-md);
    font-size: 11px;
    font-weight: 700;
    display: flex;
    flex-direction: column;
    gap: 5px;
    pointer-events: auto;
  }
  .map-legend .leg-row {
    display: flex;
    align-items: center;
    gap: 7px;
    color: var(--muted);
  }
  .map-legend .leg-row .leg-swatch {
    width: 8px;
    height: 8px;
    border-radius: 50%;
  }

  /* Map Action Control Float */
  .map-float-actions {
    position: absolute;
    bottom: 24px;
    right: 20px;
    z-index: 500;
    display: flex;
    flex-direction: column;
    gap: 8px;
    pointer-events: auto;
  }
  .map-action-btn {
    background: var(--surface);
    border: 1px solid var(--border);
    color: var(--ink);
    border-radius: 12px;
    padding: 10px 16px;
    font-size: 12.5px;
    font-weight: 800;
    display: inline-flex;
    align-items: center;
    gap: 8px;
    box-shadow: var(--shadow-md);
    cursor: pointer;
    transition: all 0.15s;
  }
  .map-action-btn:hover {
    transform: translateY(-2px);
    box-shadow: var(--shadow-lg);
  }
  .map-action-btn.primary {
    background: var(--accent);
    color: #fff;
    border-color: var(--accent);
    box-shadow: 0 6px 20px rgba(249, 115, 22, 0.35);
  }
  .map-action-btn.primary:hover {
    background: var(--accent-dark);
  }

  /* Desktop Station Sidebar */
  .station-sidebar {
    width: 360px;
    background: var(--surface);
    border-left: 1px solid var(--border);
    display: flex;
    flex-direction: column;
    z-index: 800;
    flex-shrink: 0;
    box-shadow: -4px 0 20px rgba(0,0,0,0.04);
    transition: transform 0.25s ease;
  }
  .sidebar-header {
    padding: 16px 20px;
    border-bottom: 1px solid var(--line);
    display: flex;
    align-items: center;
    justify-content: space-between;
  }
  .sidebar-header h2 {
    font-size: 14px;
    font-weight: 800;
    color: var(--ink);
  }
  .sidebar-header .count-badge {
    background: #F1F5F9;
    padding: 3px 8px;
    border-radius: 99px;
    font-size: 11px;
    font-weight: 700;
    color: var(--muted);
  }
  .sidebar-body {
    flex: 1;
    overflow-y: auto;
    padding: 12px;
  }
  .sidebar-body::-webkit-scrollbar { width: 4px; }
  .sidebar-body::-webkit-scrollbar-thumb { background: #CBD5E1; border-radius: 4px; }

  /* Station Card in List */
  .st-card {
    background: #F8FAFC;
    border: 1px solid var(--line);
    border-radius: var(--radius-md);
    padding: 12px 14px;
    margin-bottom: 10px;
    cursor: pointer;
    transition: all 0.15s ease;
  }
  .st-card:hover {
    background: #fff;
    border-color: var(--accent);
    box-shadow: var(--shadow-sm);
    transform: translateY(-1px);
  }
  .st-card.active {
    background: var(--accent-light);
    border-color: var(--accent);
    box-shadow: 0 0 0 1px var(--accent);
  }
  .st-card-top {
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
    gap: 8px;
    margin-bottom: 6px;
  }
  .st-card-title {
    font-size: 13px;
    font-weight: 800;
    color: var(--ink);
    line-height: 1.25;
  }
  .st-card-sub {
    font-size: 11px;
    color: var(--muted);
    margin-top: 2px;
  }
  .sit-badge {
    padding: 3px 8px;
    border-radius: 6px;
    font-size: 10.5px;
    font-weight: 800;
    white-space: nowrap;
  }
  .st-card-metrics {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-top: 8px;
    padding-top: 8px;
    border-top: 1px dashed var(--line);
    font-size: 11.5px;
  }
  .st-card-metrics .val {
    font-weight: 800;
    color: var(--ink);
  }

  /* Mobile Bottom Sheet */
  .mobile-bottom-sheet {
    position: fixed;
    left: 0;
    right: 0;
    bottom: 0;
    background: var(--surface);
    border-radius: 20px 20px 0 0;
    box-shadow: 0 -8px 32px rgba(0, 0, 0, 0.18);
    z-index: 1200;
    max-height: 70vh;
    overflow-y: auto;
    transform: translateY(100%);
    transition: transform 0.3s cubic-bezier(0.16, 1, 0.3, 1);
    padding: 16px 20px 30px;
  }
  .mobile-bottom-sheet.open {
    transform: translateY(0);
  }
  .sheet-drag-handle {
    width: 40px;
    height: 5px;
    background: var(--line);
    border-radius: 99px;
    margin: 0 auto 12px;
  }
  .sheet-header-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 14px;
  }
  .sheet-header-row h3 {
    font-size: 15px;
    font-weight: 800;
  }
  .sheet-close-btn {
    width: 32px;
    height: 32px;
    border-radius: 8px;
    background: #F1F5F9;
    border: none;
    display: flex;
    align-items: center;
    justify-content: center;
    color: var(--muted);
    font-size: 18px;
    cursor: pointer;
  }

  /* Custom Leaflet Marker Styling */
  .custom-water-marker {
    display: flex;
    align-items: center;
    justify-content: center;
    transition: transform 0.15s ease;
  }
  .marker-pin-inner {
    width: 22px;
    height: 22px;
    border-radius: 50%;
    border: 3px solid #FFFFFF;
    box-shadow: 0 2px 8px rgba(0,0,0,0.35);
    display: flex;
    align-items: center;
    justify-content: center;
    color: #fff;
    font-size: 10px;
  }
  .custom-water-marker:hover .marker-pin-inner {
    transform: scale(1.2);
    box-shadow: 0 4px 14px rgba(0,0,0,0.45);
  }

  /* Popup Detailed Card */
  .leaflet-popup-content-wrapper {
    border-radius: 16px;
    padding: 0;
    box-shadow: var(--shadow-lg);
    border: 1px solid var(--border);
    overflow: hidden;
  }
  .leaflet-popup-content {
    margin: 0;
    width: 300px !important;
    font-family: 'Noto Sans Thai', sans-serif;
  }
  .pop-card-head {
    padding: 14px 16px 10px;
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
    gap: 8px;
    border-bottom: 1px solid var(--line);
  }
  .pop-title { font-size: 14px; font-weight: 800; color: var(--ink); line-height: 1.3; }
  .pop-subtitle { font-size: 11px; color: var(--muted); margin-top: 2px; }
  .pop-grid {
    padding: 12px 16px;
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
    background: #F8FAFC;
  }
  .pop-stat-box {
    background: #fff;
    border: 1px solid var(--line);
    border-radius: 8px;
    padding: 8px 10px;
  }
  .pop-stat-lbl { font-size: 10px; color: var(--muted); font-weight: 600; }
  .pop-stat-val { font-size: 14px; font-weight: 900; color: var(--ink); margin-top: 2px; }
  .pop-footer {
    padding: 12px 16px 14px;
    display: flex;
    flex-direction: column;
    gap: 8px;
  }
  .pop-time { font-size: 10.5px; color: var(--muted); text-align: center; }
  .pop-btn-gmaps {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
    background: var(--ink);
    color: #fff;
    text-decoration: none;
    padding: 8px 12px;
    border-radius: 8px;
    font-size: 11.5px;
    font-weight: 700;
    transition: background 0.15s;
  }
  .pop-btn-gmaps:hover { background: #1E293B; }

  /* Loading Skeleton & Error state */
  .skeleton-loader {
    position: absolute;
    inset: 0;
    background: rgba(248, 250, 252, 0.85);
    backdrop-filter: blur(4px);
    z-index: 1500;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 12px;
    transition: opacity 0.3s;
  }
  .skeleton-loader.hidden {
    opacity: 0;
    pointer-events: none;
  }
  .spinner-circle {
    width: 38px;
    height: 38px;
    border: 3.5px solid var(--line);
    border-top-color: var(--accent);
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
  }
  .skeleton-text {
    font-size: 13px;
    font-weight: 700;
    color: var(--muted);
  }

  /* Empty state */
  .empty-state {
    padding: 40px 20px;
    text-align: center;
    color: var(--muted);
  }
  .empty-state i {
    font-size: 36px;
    color: var(--faint);
    margin-bottom: 8px;
    display: block;
  }

  /* Toast Notification */
  .toast {
    position: fixed;
    bottom: 24px;
    left: 50%;
    transform: translateX(-50%) translateY(30px);
    z-index: 2000;
    background: #0F172A;
    color: #fff;
    padding: 10px 20px;
    border-radius: 12px;
    font-size: 12px;
    font-weight: 700;
    box-shadow: var(--shadow-lg);
    opacity: 0;
    pointer-events: none;
    transition: all 0.25s ease;
  }
  .toast.show {
    opacity: 1;
    transform: translateX(-50%) translateY(0);
  }

  /* Responsive Rules */
  @media (max-width: 900px) {
    .station-sidebar { display: none; }
    .search-container { width: 220px; }
  }

  @media (max-width: 640px) {
    .page-header { padding: 0 14px; height: 56px; }
    .brand-text .sub { display: none; }
    .status-pill { display: none; }
    .control-bar { padding: 8px 14px; gap: 8px; }
    .search-container { width: 100%; max-width: none; }
    .quick-controls { display: none; }
    .map-legend { bottom: 80px; left: 14px; padding: 8px 10px; font-size: 10px; }
    .map-float-actions { bottom: 20px; right: 14px; left: 14px; flex-direction: row; }
    .map-action-btn { flex: 1; justify-content: center; }
  }
</style>
</head>
<body>

<div class="app-layout">
  
  <!-- 1. Page Header -->
  <header class="page-header">
    <a href="/map" class="brand-group">
      <div class="brand-logo"><i class="ph-fill ph-drop"></i></div>
      <div class="brand-text">
        <h1>แผนที่ระดับน้ำ</h1>
        <div class="sub">FLOODCARE AI · Water Telemetry & Early Warning</div>
      </div>
    </a>
    
    <div class="header-actions">
      <div class="status-pill" id="statusPill">
        <span class="pulse-dot"></span>
        <span id="statusText">เชื่อมต่อระบบตรวจวัดสด</span>
      </div>
      
      <button class="btn-refresh" id="refreshBtn" title="รีเฟรชข้อมูล">
        <i class="ph ph-arrows-clockwise"></i>
      </button>

      <a href="/dashboard" class="btn-nav-dash">
        <i class="ph-bold ph-gauge"></i>
        <span>Command Center</span>
      </a>
    </div>
  </header>

  <!-- 2. Search / Filter / Controls Subheader -->
  <div class="control-bar">
    <div class="search-container">
      <div class="search-box">
        <i class="ph ph-magnifying-glass"></i>
        <input type="text" id="searchInput" placeholder="ค้นหาสถานี, ลำน้ำ, จังหวัด..." autocomplete="off">
        <i class="ph ph-x" id="searchClearBtn" style="cursor:pointer;display:none;"></i>
      </div>
      <div class="search-dropdown" id="searchDropdown"></div>
    </div>

    <div class="filter-chips" id="filterChips">

  </div>

  <!-- Global Toast -->
  <div class="toast" id="toast"></div>

<script>
/* ── Color Mapping & Constants ── */
const SITUATION_CONFIG = {
  'วิกฤต':     { color: '#EF4444', bg: '#FEF2F2', border: '#B91C1C', text: '#991B1B' },
  'ล้นตลิ่ง':   { color: '#DC2626', bg: '#FEE2E2', border: '#991B1B', text: '#7F1D1D' },
  'มาก':       { color: '#F59E0B', bg: '#FFFBEB', border: '#D97706', text: '#92400E' },
  'เฝ้าระวัง':   { color: '#EAB308', bg: '#FEFCE8', border: '#CA8A04', text: '#854D0E' },
  'ปกติ':      { color: '#10B981', bg: '#ECFDF5', border: '#059669', text: '#065F46' },
  'น้อย':      { color: '#3B82F6', bg: '#EFF6FF', border: '#2563EB', text: '#1E40AF' },
  'น้อยวิกฤต':  { color: '#F97316', bg: '#FFF7ED', border: '#EA580C', text: '#9A3412' }
};

const SITUATION_KEYS = ['ทั้งหมด', 'ล้นตลิ่ง', 'วิกฤต', 'มาก', 'เฝ้าระวัง', 'ปกติ', 'น้อย'];

const TILE_LAYERS = {
  light: 'https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png',
  satellite: 'https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}',
  osm: 'https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png'
};

/* ── Application State ── */
const appState = {
  map: null,
  tileLayer: null,
  currentTile: 'light',
  markers: new Map(), // station_code -> L.marker
  allStations: [],
  filteredStations: [],
  activeFilter: 'ทั้งหมด',
  searchQuery: '',
  selectedStation: null,
  cachedDataTime: 0,
  refreshTimer: null,
  abortController: null,
  userLocationMarker: null,
  userLocationAccuracyCircle: null
};

/* ── Utility Functions ── */
function esc(str) {
  if (str == null) return '';
  return String(str).replace(/[&<>"']/g, m => ({
    '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
  }[m]));
}

function showToast(msg) {
  const t = document.getElementById('toast');
  if (!t) return;
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 3200);
}

function getSituationStyle(situation) {
  return SITUATION_CONFIG[situation] || { color: '#64748B', bg: '#F1F5F9', border: '#CBD5E1', text: '#334155' };
}

/* ── 1. Map Initialization (Single-Instance Guarantee) ── */
function initWaterMap() {
  if (appState.map) return; // Prevent duplicate initialization

  if (typeof L === 'undefined' || typeof L.map !== 'function') {
    const el = document.getElementById('map');
    if (el) {
      el.innerHTML = '<div style="display:flex;align-items:center;justify-content:center;height:100%;padding:24px;text-align:center;color:#64748B;font-size:13px;">ไม่สามารถโหลดแผนที่ได้ (การเชื่อมต่ออินเทอร์เน็ตหรือ CDN ขัดข้อง)<br>รายการสถานีด้านล่างยังใช้งานได้ตามปกติ</div>';
    }
    return;
  }

  try {
    appState.map = L.map('map', {
      zoomControl: false,
      attributionControl: false,
      maxZoom: 18,
      minZoom: 5
    }).setView([6.65, 101.30], 9); // Center Southern Thailand flood monitoring region

    appState.tileLayer = L.tileLayer(TILE_LAYERS[appState.currentTile], {
      maxZoom: 18,
      subdomains: 'abcd'
    }).addTo(appState.map);

    // Clean Zoom Control on Top-Right
    L.control.zoom({ position: 'topright' }).addTo(appState.map);

    // Resize handling
    setTimeout(() => {
      if (appState.map) appState.map.invalidateSize();
    }, 200);
  } catch (e) {
    console.error('initWaterMap failed:', e);
    appState.map = null;
  }
}

/* ── 2. Marker Custom Icon Factory ── */
function createMarkerIcon(situation) {
  const cfg = getSituationStyle(situation);
  const html = `
    <div class="custom-water-marker">
      <div class="marker-pin-inner" style="background: ${cfg.color};">
        <i class="ph-fill ph-drop"></i>
      </div>
    </div>
  `;
  return L.divIcon({
    className: '',
    html: html,
    iconSize: [24, 24],
    iconAnchor: [12, 12],
    popupAnchor: [0, -14]
  });
}

/* ── 3. Station Popup HTML Builder ── */
function buildStationPopupHtml(s) {
  const cfg = getSituationStyle(s.situation);
  const gmapsUrl = `https://www.google.com/maps/search/?api=1&query=${s.latitude},${s.longitude}`;
  const bank = (s.bank_level && s.bank_level !== '-' && s.bank_level !== 0) ? s.bank_level : null;
  const water = typeof s.water_level === 'number' ? s.water_level.toFixed(2) : s.water_level;
  
  let diffHtml = '';
  if (bank && typeof s.water_level === 'number') {
    const diff = s.water_level - parseFloat(bank);
    if (diff >= 0) {
      diffHtml = `<span style="color:#DC2626;font-weight:800;">สูงกว่าตลิ่ง +${diff.toFixed(2)} ม.</span>`;
    } else {
      diffHtml = `<span style="color:#059669;font-weight:800;">ต่ำกว่าตลิ่ง ${Math.abs(diff).toFixed(2)} ม.</span>`;
    }
  }

  return `
    <div class="pop-card">
      <div class="pop-card-head">
        <div>
          <div class="pop-title">${esc(s.station_name)}</div>
          <div class="pop-subtitle">${esc(s.location || s.province)} ${s.river ? '· ' + esc(s.river) : ''}</div>
        </div>
        <span class="sit-badge" style="background:${cfg.bg};color:${cfg.text};border:1px solid ${cfg.border};">
          ${esc(s.situation)}
        </span>
      </div>
      <div class="pop-grid">
        <div class="pop-stat-box">
          <div class="pop-stat-lbl">ระดับน้ำปัจจุบัน</div>
          <div class="pop-stat-val" style="color:${cfg.color};">${water} ม.</div>
        </div>
        <div class="pop-stat-box">
          <div class="pop-stat-lbl">ระดับตลิ่ง</div>
          <div class="pop-stat-val">${bank ? bank + ' ม.' : '—'}</div>
        </div>
      </div>
      <div class="pop-footer">
        ${diffHtml ? `<div style="font-size:11px;text-align:center;">สถานะ: ${diffHtml}</div>` : ''}
        <div class="pop-time"><i class="ph ph-clock"></i> อัปเดตล่าสุด: ${esc(s.measure_time || 'เมื่อสักครู่')} (แนวโน้ม: ${esc(s.trend || 'คงที่')})</div>
        <a class="pop-btn-gmaps" href="${gmapsUrl}" target="_blank" rel="noopener">
          <i class="ph-bold ph-navigation-arrow"></i> นำทางผ่าน Google Maps
        </a>
      </div>
    </div>
  `;
}

/* ── 4. Marker Synchronization (Diffing & Reusing) ── */
function syncMarkers() {
  if (!appState.map) return;

  const visibleStations = appState.filteredStations;
  const visibleCodes = new Set(visibleStations.map(s => s.station_code || (s.latitude + ',' + s.longitude)));

  // Remove markers that are no longer visible
  for (const [code, marker] of appState.markers.entries()) {
    if (!visibleCodes.has(code)) {
      appState.map.removeLayer(marker);
      appState.markers.delete(code);
    }
  }

  // Add or update visible markers
  visibleStations.forEach(s => {
    if (!s.latitude || !s.longitude) return;
    const code = s.station_code || (s.latitude + ',' + s.longitude);

    if (appState.markers.has(code)) {
      // Re-use existing marker, just update popup & icon if needed
      const marker = appState.markers.get(code);
      marker.setLatLng([s.latitude, s.longitude]);
      marker.setIcon(createMarkerIcon(s.situation));
      marker.setPopupContent(buildStationPopupHtml(s));
    } else {
      // Create new marker
      const marker = L.marker([s.latitude, s.longitude], {
        icon: createMarkerIcon(s.situation)
      });
      marker.bindPopup(buildStationPopupHtml(s), { maxWidth: 320 });
      marker.on('click', () => {
        selectStation(s, false);
      });
      marker.addTo(appState.map);
      appState.markers.set(code, marker);
    }
  });
}

/* ── 5. Render Sidebar & Station List ── */
function renderSidebarList() {
  const container = document.getElementById('stationListContainer');
  const countBadge = document.getElementById('sidebarCount');
  if (!container) return;

  countBadge.textContent = `${appState.filteredStations.length} สถานี`;

  if (appState.filteredStations.length === 0) {
    container.innerHTML = `
      <div class="empty-state">
        <i class="ph ph-magnifying-glass"></i>
        <div>ไม่พบสถานีวัดระดับน้ำตามเงื่อนไขที่เลือก</div>
      </div>
    `;
    return;
  }

  container.innerHTML = appState.filteredStations.map(s => {
    const cfg = getSituationStyle(s.situation);
    const isSelected = appState.selectedStation && appState.selectedStation.station_code === s.station_code;
    return `
      <div class="st-card ${isSelected ? 'active' : ''}" data-code="${esc(s.station_code)}">
        <div class="st-card-top">
          <div>
            <div class="st-card-title">${esc(s.station_name)}</div>
            <div class="st-card-sub">${esc(s.province || '')} ${s.river ? '· ' + esc(s.river) : ''}</div>
          </div>
          <span class="sit-badge" style="background:${cfg.bg};color:${cfg.text};border:1px solid ${cfg.border};">
            ${esc(s.situation)}
          </span>
        </div>
        <div class="st-card-metrics">
          <span>ระดับน้ำ: <b class="val">${esc(s.water_level)} ม.</b></span>
          <span>ตลิ่ง: <b>${s.bank_level && s.bank_level !== '-' ? esc(s.bank_level) + ' ม.' : '—'}</b></span>
          <span>แนวโน้ม: <b>${esc(s.trend || 'คงที่')}</b></span>
        </div>
      </div>
    `;
  }).join('');

  // Attach event listeners
  container.querySelectorAll('.st-card[data-code]').forEach(card => {
    card.addEventListener('click', () => {
      const code = card.dataset.code;
      const s = appState.allStations.find(x => x.station_code === code);
      if (s) selectStation(s, true);
    });
  });
}

/* ── 6. Filter Chips Component ── */
function renderFilterChips() {
  const container = document.getElementById('filterChips');
  if (!container) return;

  const counts = { 'ทั้งหมด': appState.allStations.length };
  appState.allStations.forEach(s => {
    counts[s.situation] = (counts[s.situation] || 0) + 1;
  });

  container.innerHTML = SITUATION_KEYS.map(key => {
    const isActive = appState.activeFilter === key;
    const cfg = key === 'ทั้งหมด' ? null : getSituationStyle(key);
    const dot = cfg ? `<span class="dot-indicator" style="background:${cfg.color}"></span>` : '';
    const count = counts[key] || 0;
    return `
      <div class="chip ${isActive ? 'active' : ''}" data-filter="${esc(key)}">
        ${dot}
        <span>${esc(key)}</span>
        <span style="opacity:0.75;font-size:10px;">(${count})</span>
      </div>
    `;
  }).join('');

  container.querySelectorAll('.chip[data-filter]').forEach(chip => {
    chip.addEventListener('click', () => {
      appState.activeFilter = chip.dataset.filter;
      applyFilters();
      renderFilterChips();
    });
  });
}

/* ── 7. Apply Search & Filter Pipeline ── */
function applyFilters() {
  let list = appState.allStations;

  // 1. Situation Filter
  if (appState.activeFilter !== 'ทั้งหมด') {
    list = list.filter(s => s.situation === appState.activeFilter);
  }

  // 2. Search Query
  const q = appState.searchQuery.trim().toLowerCase();
  if (q) {
    list = list.filter(s => 
      (s.station_name || '').toLowerCase().includes(q) ||
      (s.station_code || '').toLowerCase().includes(q) ||
      (s.province || '').toLowerCase().includes(q) ||
      (s.river || '').toLowerCase().includes(q) ||
      (s.location || '').toLowerCase().includes(q)
    );
  }

  appState.filteredStations = list;
  syncMarkers();
  renderSidebarList();
}

/* ── 8. Station Selection Action ── */
function selectStation(station, flyTo = true) {
  appState.selectedStation = station;
  
  // Highlight active in sidebar
  document.querySelectorAll('.st-card').forEach(card => {
    card.classList.toggle('active', card.dataset.code === station.station_code);
  });

  if (flyTo && appState.map) {
    appState.map.flyTo([station.latitude, station.longitude], 14, {
      animate: true,
      duration: 0.6
    });
  }

  // Open Popup
  setTimeout(() => {
    const code = station.station_code || (station.latitude + ',' + station.longitude);
    const marker = appState.markers.get(code);
    if (marker) marker.openPopup();
  }, flyTo ? 650 : 50);

  // If on Mobile, show in bottom sheet
  if (window.innerWidth <= 768) {
    openMobileStationDetail(station);
  }
}

/* ── 9. Mobile Bottom Sheet ── */

  title.textContent = 'รายละเอียดสถานีวัดระดับน้ำ';
  body.innerHTML = `
    <div style="margin-bottom:14px;">
      <div style="display:flex;justify-content:space-between;align-items:flex-start;gap:8px;">
        <div>

        </div>
        <span class="sit-badge" style="background:${cfg.bg};color:${cfg.text};border:1px solid ${cfg.border};padding:4px 10px;font-size:12px;">

          <div style="font-size:18px;font-weight:900;color:${cfg.color};margin-top:2px;">${esc(s.water_level)} ม.</div>

        </div>
      </div>
      <div style="font-size:11px;color:var(--muted);margin-top:12px;text-align:center;">
        อัปเดตล่าสุด: ${esc(s.measure_time || 'เมื่อสักครู่')} (แนวโน้ม: ${esc(s.trend || 'คงที่')})
      </div>
      <div style="display:flex;gap:10px;margin-top:16px;">
        <a href="${gmapsUrl}" target="_blank" style="flex:1;background:var(--ink);color:#fff;text-align:center;padding:12px;border-radius:12px;font-weight:700;font-size:13px;text-decoration:none;display:flex;align-items:center;justify-content:center;gap:6px;">
          <i class="ph-bold ph-map-pin"></i> Google Maps
        </a>
        <a href="/liff/sos" style="flex:1;background:var(--accent);color:#fff;text-align:center;padding:12px;border-radius:12px;font-weight:700;font-size:13px;text-decoration:none;display:flex;align-items:center;justify-content:center;gap:6px;">
          <i class="ph-fill ph-siren"></i> แจ้งขอความช่วยเหลือ
        </a>
      </div>

  sheet.classList.add('open');

function openMobileNearestList(nearestStations) {
  const sheet = document.getElementById('mobileSheet');
  const title = document.getElementById('sheetTitle');
  const body = document.getElementById('sheetBody');
  if (!sheet || !body) return;

  title.textContent = `สถานีใกล้คุณ (${nearestStations.length})`;
  body.innerHTML = nearestStations.map(s => {
    const cfg = getSituationStyle(s.situation);
    return `
      <div class="st-card" data-code="${esc(s.station_code)}" style="margin-bottom:8px;">
        <div class="st-card-top">
          <div>
            <div class="st-card-title">${esc(s.station_name)}</div>
            <div class="st-card-sub">${esc(s.province || '')} · ระยะทาง <b>${(s.distance_km || 0).toFixed(1)} กม.</b></div>
          </div>
          <span class="sit-badge" style="background:${cfg.bg};color:${cfg.text};border:1px solid ${cfg.border};">
            ${esc(s.situation)}
          </span>
        </div>
      </div>
    `;
  }).join('') || '<div class="empty-state">ไม่พบสถานีในรัศมีใกล้เคียง</div>';

      if (s) {
        sheet.classList.remove('open');
        selectStation(s, true);
      }

  sheet.classList.add('open');
}

/* ── 10. Data Fetching Pipeline ── */
async function fetchWaterStations(isBackground = false) {
  const refreshBtn = document.getElementById('refreshBtn');
  const skeleton = document.getElementById('skeletonLoader');
  const statusText = document.getElementById('statusText');

  if (!isBackground && refreshBtn) refreshBtn.classList.add('loading');

  try {
    if (appState.abortController) {
      appState.abortController.abort();
    }
    appState.abortController = new AbortController();
    // Hard timeout on top of the "abort the previous request" controller
    // above — without this, a truly stalled connection (server hung, not
    // just slow) would never reject on its own and the 90s auto-refresh
    // tick would just keep stacking silently-pending requests.
    const timeoutId = setTimeout(() => appState.abortController.abort(), 15000);

    const res = await fetch('/api/water-stations', {
      signal: appState.abortController.signal
    });
    clearTimeout(timeoutId);

    if (!res.ok) throw new Error('HTTP ' + res.status);
    const data = await res.json();

    if (!data.success) throw new Error('API reported failure');

    appState.allStations = data.stations || [];
    appState.cachedDataTime = Date.now();

    renderFilterChips();
    applyFilters();

    if (statusText) {
      statusText.textContent = `ข้อมูลสด · ${appState.allStations.length} สถานี`;
    }

    if (!isBackground) {
      showToast(`อัปเดตข้อมูลระดับน้ำแล้ว (${appState.allStations.length} สถานี)`);
    }
  } catch (err) {
    if (err.name !== 'AbortError') {
      console.error('Failed to load water stations:', err);
      if (statusText) statusText.textContent = 'ไม่สามารถดึงข้อมูลล่าสุดได้';
      if (!isBackground) showToast('โหลดข้อมูลสถานีไม่สำเร็จ กรุณาลองใหม่อีกครั้ง');
    }
  } finally {
    if (skeleton) skeleton.classList.add('hidden');
    if (refreshBtn) refreshBtn.classList.remove('loading');
  }
}

/* ── 11. Geolocation: Find Nearest Stations ── */
async function locateUserAndFindNearest() {
  const btnTop = document.getElementById('btnLocateMeTop');
  const btnFloat = document.getElementById('locateBtnFloating');

  if (!navigator.geolocation) {
    showToast('อุปกรณ์ของคุณไม่รองรับการค้นหาพิกัด GPS');
    return;
  }
  if (!window.isSecureContext) {
    showToast('จำเป็นต้องใช้งานผ่าน HTTPS เพื่อระบุตำแหน่ง GPS');
    return;
  }

  const setBtnLoading = (isLoading) => {
    [btnTop, btnFloat].forEach(btn => {
      if (btn) {
        btn.disabled = isLoading;
        btn.innerHTML = isLoading 
          ? '<i class="ph-bold ph-spinner" style="animation:spin 0.8s linear infinite;"></i> กำลังหาตำแหน่ง...'
          : '<i class="ph-bold ph-crosshair"></i> สถานีใกล้ฉัน';
      }
    });
  };

  setBtnLoading(true);

  navigator.geolocation.getCurrentPosition(
    async (pos) => {
      const { latitude, longitude, accuracy } = pos.coords;

      // Update Map View
      if (appState.map) {
        appState.map.setView([latitude, longitude], 12);

        // Draw/Update user location marker
        if (appState.userLocationMarker) {
          appState.userLocationMarker.setLatLng([latitude, longitude]);
        } else {
          appState.userLocationMarker = L.circleMarker([latitude, longitude], {
            radius: 8,
            color: '#F97316',
            fillColor: '#EA580C',
            fillOpacity: 0.9,
            weight: 3
          }).addTo(appState.map).bindPopup('<b>ตำแหน่งปัจจุบันของคุณ</b>');
        }

        if (appState.userLocationAccuracyCircle) {
          appState.userLocationAccuracyCircle.setLatLng([latitude, longitude]);
          appState.userLocationAccuracyCircle.setRadius(accuracy || 500);
        } else {
          appState.userLocationAccuracyCircle = L.circle([latitude, longitude], {
            radius: accuracy || 500,
            color: '#F97316',
            fillColor: '#F97316',
            fillOpacity: 0.12,
            weight: 1
          }).addTo(appState.map);
        }
      }

      // Query nearest stations API
      try {
        const nearController = new AbortController();
        const nearTimeoutId = setTimeout(() => nearController.abort(), 15000);
        const res = await fetch(`/api/water-stations/nearest?lat=${latitude}&lon=${longitude}&limit=6`, {
          signal: nearController.signal
        });
        clearTimeout(nearTimeoutId);
        if (!res.ok) throw new Error('HTTP ' + res.status);
        const data = await res.json();
        const nearestList = data.stations || data.nearest || [];

        if (nearestList.length > 0) {
          showToast(`พบ ${nearestList.length} สถานีใกล้ตำแหน่งของคุณ`);
          openMobileNearestList(nearestList);
        } else {
          showToast('ไม่พบสถานีวัดน้ำในบริเวณใกล้เคียง');
        }
      } catch (e) {
        showToast('ค้นหาสถานีใกล้เคียงไม่สำเร็จ');
      } finally {
        setBtnLoading(false);
      }
    },
    (err) => {
      setBtnLoading(false);
      const errors = {
        1: 'กรุณาอนุญาตการเข้าถึงตำแหน่งพิกัดในเบราว์เซอร์',
        2: 'ไม่สามารถระบุพิกัดตำแหน่งของคุณได้ในขณะนี้',
        3: 'ค้นหาพิกัดตำแหน่งนานเกินเวลา (Timeout)'
      };
      showToast(errors[err.code] || 'ไม่สามารถดึงตำแหน่งปัจจุบันได้');
    },
    { enableHighAccuracy: true, timeout: 12000, maximumAge: 0 }
  );
}

/* ── 12. Search Input Handling with Debounce ── */
function setupSearch() {
  const searchInput = document.getElementById('searchInput');
  const searchDropdown = document.getElementById('searchDropdown');
  const clearBtn = document.getElementById('searchClearBtn');
  let debounceTimer = null;

  searchInput.addEventListener('input', () => {
    const q = searchInput.value;
    clearBtn.style.display = q ? 'block' : 'none';

    clearTimeout(debounceTimer);
    debounceTimer = setTimeout(() => {
      appState.searchQuery = q;
      applyFilters();

      // Render Dropdown suggestions
      if (!q.trim()) {
        searchDropdown.classList.remove('show');
        return;
      }

      const matches = appState.filteredStations.slice(0, 8);
      if (matches.length === 0) {
        searchDropdown.innerHTML = `<div style="padding:12px;font-size:12px;color:var(--muted);text-align:center;">ไม่พบสถานีที่ตรงกับ "${esc(q)}"</div>`;
      } else {
        searchDropdown.innerHTML = matches.map(s => {
          const cfg = getSituationStyle(s.situation);
          return `
            <div class="search-item" data-code="${esc(s.station_code)}">
              <div class="search-item-info">
                <div class="title">${esc(s.station_name)}</div>
                <div class="desc">${esc(s.province || '')} ${s.river ? '· แม่น้ำ' + esc(s.river) : ''} · ระดับน้ำ ${esc(s.water_level)} ม.</div>
              </div>
              <span class="sit-badge" style="background:${cfg.bg};color:${cfg.text};font-size:10.5px;">${esc(s.situation)}</span>
            </div>
          `;
        }).join('');
      }
      searchDropdown.classList.add('show');

      searchDropdown.querySelectorAll('.search-item[data-code]').forEach(item => {
        item.addEventListener('click', () => {
          const s = appState.allStations.find(x => x.station_code === item.dataset.code);
          if (s) selectStation(s, true);
          searchDropdown.classList.remove('show');
        });
      });
    }, 150);
  });

  clearBtn.addEventListener('click', () => {
    searchInput.value = '';
    clearBtn.style.display = 'none';
    searchDropdown.classList.remove('show');
    appState.searchQuery = '';
    applyFilters();
  });

  document.addEventListener('click', (e) => {
    if (!e.target.closest('.search-container')) {
      searchDropdown.classList.remove('show');
    }
  });
}

/* ── 13. Map Layer Switcher ── */
function setupLayerToggle() {
  const btn = document.getElementById('btnToggleLayer');
  const label = document.getElementById('layerLabel');
  if (!btn) return;

  const modes = [
    { key: 'light', label: 'แผนที่สว่าง' },
    { key: 'satellite', label: 'ภาพดาวเทียม' },
    { key: 'osm', label: 'แผนที่ภูมิประเทศ' }
  ];
  let currentIdx = 0;

  btn.addEventListener('click', () => {
    currentIdx = (currentIdx + 1) % modes.length;
    const mode = modes[currentIdx];
    appState.currentTile = mode.key;
    label.textContent = mode.label;

    if (appState.tileLayer && appState.map) {
      appState.tileLayer.setUrl(TILE_LAYERS[mode.key]);
    }
  });
}

/* ── 14. Event Bindings & Lifecycle Management ── */
function bindGlobalEvents() {
  // Refresh button
  document.getElementById('refreshBtn').addEventListener('click', () => fetchWaterStations(false));

  // Locate Me Buttons
  document.getElementById('btnLocateMeTop').addEventListener('click', locateUserAndFindNearest);
  document.getElementById('locateBtnFloating').addEventListener('click', locateUserAndFindNearest);

  // Mobile list open button
  document.getElementById('listBtnFloating').addEventListener('click', () => {
    openMobileNearestList(appState.filteredStations);
  });

  // Mobile Sheet close
  document.getElementById('sheetCloseBtn').addEventListener('click', () => {
    document.getElementById('mobileSheet').classList.remove('open');
  });

  // Clean interval when leaving tab
  document.addEventListener('visibilitychange', () => {
    if (document.hidden) {
      if (appState.refreshTimer) clearInterval(appState.refreshTimer);
    } else {
      // Resume refresh
      fetchWaterStations(true);
      appState.refreshTimer = setInterval(() => fetchWaterStations(true), 90000);
    }
  });

  window.addEventListener('beforeunload', () => {
    if (appState.refreshTimer) clearInterval(appState.refreshTimer);
  });
}

/* ── 15. Application Boot ── */
document.addEventListener('DOMContentLoaded', () => {
  // Each boot step wrapped independently so one failure (e.g. map/CDN)
  // can't stop the rest (search, filters, data fetch, auto-refresh) from
  // initializing — a page that's half-broken is much better than one
  // that's entirely inert because of a single early exception.
  try { initWaterMap(); } catch (e) { console.error('initWaterMap boot failed:', e); }
  try { setupSearch(); } catch (e) { console.error('setupSearch failed:', e); }
  try { setupLayerToggle(); } catch (e) { console.error('setupLayerToggle failed:', e); }
  try { bindGlobalEvents(); } catch (e) { console.error('bindGlobalEvents failed:', e); }

  // Initial fetch
  fetchWaterStations(false);

  // Auto-refresh every 90 seconds
  appState.refreshTimer = setInterval(() => fetchWaterStations(true), 90000);

  // Pause polling while the tab is hidden, resume with an immediate
  // refresh when it becomes visible again — avoids piling up background
  // requests in inactive tabs and keeps data fresh the moment someone
  // comes back to check it.
  document.addEventListener('visibilitychange', () => {
    if (document.hidden) {
      if (appState.refreshTimer) { clearInterval(appState.refreshTimer); appState.refreshTimer = null; }
    } else {
      fetchWaterStations(true);
      if (!appState.refreshTimer) appState.refreshTimer = setInterval(() => fetchWaterStations(true), 90000);
    }
  });
});
